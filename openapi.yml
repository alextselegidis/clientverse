          nullable: true
          readOnly: true
        next_recurring_date:
          type: string
          format: date
          nullable: true
          readOnly: true
        notes:
          type: string
          nullable: true
          readOnly: true
        terms:
          type: string
          nullable: true
          readOnly: true
        items:
          type: array
          readOnly: true
          description: Line items, with the include
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Payment:
      type: object
      description: Read only - created and changed on the web pages.
      properties:
        id:
