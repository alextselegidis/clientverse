          type: integer
          readOnly: true
        subject:
          type: string
          maxLength: 255
        customer_id:
          type: integer
        contact_id:
          type: integer
          nullable: true
        department_id:
          type: integer
          nullable: true
        assigned_to:
          type: integer
          nullable: true
        status:
          type: string
          enum: [open, answered, on_hold, closed]
          description: Set on update only; a new ticket is open
        priority:
          type: string
          enum: [low, normal, high]
        body:
          type: string
          description: Create only - the first message, saved as the first reply by the token's user
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - subject
        - customer_id
        - priority
        - body

    Item:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
          maxLength: 255
        unit_price:
          type: number
          format: decimal
        tax_rate:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - description
        - unit_price
        - tax_rate

    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        expense_date:
          type: string
          format: date
        category:
          type: string
          nullable: true
          maxLength: 100
        description:
          type: string
          maxLength: 255
        amount:
          type: number
          format: decimal
          minimum: 0
        currency:
          type: string
