          readOnly: true
        issue_date:
          type: string
          format: date
          readOnly: true
        open_till:
          type: string
          format: date
          readOnly: true
        currency:
          type: string
          readOnly: true
        total:
          type: number
          format: decimal
          readOnly: true
        notes:
          type: string
          nullable: true
          readOnly: true
        terms:
          type: string
          nullable: true
          readOnly: true
        items:
          type: array
          readOnly: true
          description: Line items, with the include
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Subscription:
      type: object
      description: Read only - created and changed on the web pages.
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          nullable: true
          readOnly: true
        currency:
          type: string
          readOnly: true
        amount:
          type: number
          format: decimal
          readOnly: true
        tax_rate:
          type: number
          format: decimal
          readOnly: true
        interval:
          type: string
          enum: [week, month, year]
          readOnly: true
        status:
          type: string
          enum: [draft, pending, active, past_due, canceled]
          readOnly: true
        current_period_end:
          type: string
          format: date
          nullable: true
          readOnly: true
        canceled_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            to:
              type: integer
            total:
              type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object

