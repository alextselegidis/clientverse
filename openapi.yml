        - name: filter[name]
          in: query
          schema:
            type: string
        - name: filter[email]
          in: query
          schema:
            type: string
        - name: filter[phone]
          in: query
          schema:
            type: string
        - name: filter[company]
          in: query
          schema:
            type: string
        - name: filter[type]
          in: query
          schema:
            type: string
            enum: [company, individual]
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [lead, active, inactive]
        - name: filter[created_at]
          in: query
          schema:
            type: string
            format: date
        - name: filter[updated_at]
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
    post:
      tags:
        - Customers
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/search:
    post:
      tags:
        - Customers
      summary: Advanced search customers
      description: |
        Search customers with advanced filtering, scopes, sorting, and aggregates.
        Searchable fields: name, email, phone, company, address
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/IncludeParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              simpleSearch:
                summary: Simple text search
                value:
                  search:
                    value: "Acme Corp"
              filteredSearch:
                summary: Search with filters
                value:
                  filters:
                    - field: status
                      operator: "="
                      value: active
                    - field: type
                      operator: "="
                      value: company
                  sort:
                    - field: name
                      direction: asc
              withAggregates:
                summary: Search with aggregates
                value:
                  filters:
                    - field: status
                      operator: "="
                      value: active
                  aggregates:
                    - relation: contacts
                      type: count
                    - relation: sales
                      type: sum
                      field: value
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'

  /customers/batch:
    post:
      tags:
        - Customers
      summary: Batch create customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '200':
          description: Customers created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
    patch:
      tags:
        - Customers
      summary: Batch update customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateRequest'
      responses:
        '200':
          description: Customers updated
    delete:
      tags:
        - Customers
      summary: Batch delete customers
      parameters:
        - name: resources
          in: query
          description: Comma-separated list of resource IDs to delete
          required: true
          schema:
            type: string
            example: "1,2,3"
      responses:
        '200':
          description: Customers deleted

  /customers/{id}:
    get:
      tags:
        - Customers
      summary: Get a customer
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/IncludeParam'
