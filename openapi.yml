components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
      description: API token generated from account settings

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        default: 15
        minimum: 1
        maximum: 100
    SortParam:
      name: sort
      in: query
      description: |
        Sort field(s). Prefix with `-` for descending order.
        Multiple fields can be comma-separated.
      schema:
        type: string
      examples:
        ascending:
          value: name
          summary: Sort by name ascending
        descending:
          value: -created_at
          summary: Sort by created_at descending
        multiple:
          value: name,-created_at
          summary: Sort by name asc, then created_at desc
    IncludeParam:
      name: include
      in: query
      description: Comma-separated list of relations to include
      schema:
        type: string
    WithCountParam:
      name: with_count
      in: query
      description: Comma-separated list of relations to count
      schema:
        type: string
    IdPathParam:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer

  schemas:
    SearchRequest:
      type: object
      description: Advanced search request body for POST /search endpoints
      properties:
        scopes:
          type: array
          description: Model scopes to apply
          items:
            type: object
            properties:
              name:
                type: string
                description: Scope name
              parameters:
                type: array
                description: Scope parameters
                items:
                  type: string
            required:
              - name
        filters:
          type: array
          description: Filter conditions
          items:
            type: object
            properties:
              type:
                type: string
                enum: [and, or]
                default: and
                description: Logical operator for combining with previous filters
              field:
                type: string
                description: Field name to filter on
              operator:
                type: string
                enum: ['=', '!=', '<', '<=', '>', '>=', 'like', 'not like', 'in', 'not in']
                default: '='
              value:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      type: string
                description: Filter value
            required:
              - field
              - value
        search:
          type: object
          description: Full-text search
          properties:
            value:
              type: string
              description: Search term
          required:
            - value
        sort:
          type: array
          description: Sort configuration
          items:
            type: object
            properties:
              field:
                type: string
              direction:
                type: string
                enum: [asc, desc]
                default: asc
            required:
              - field
        aggregates:
          type: array
          description: Aggregate calculations on relationships
          items:
            type: object
            properties:
              relation:
                type: string
                description: Relationship name
              type:
                type: string
                enum: [count, sum, avg, min, max, exists]
              field:
                type: string
                description: Field for sum/avg/min/max aggregates
              filters:
                type: array
                description: Filters to apply on the relation
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    operator:
                      type: string
                    value:
                      type: string
            required:
              - relation
              - type

    BatchCreateRequest:
      type: object
      properties:
        resources:
          type: array
          description: Array of resources to create
          items:
            type: object
      required:
        - resources

    BatchUpdateRequest:
      type: object
      properties:
        resources:
          type: array
          description: Array of resources to update (must include id)
          items:
            type: object
            properties:
              id:
                type: integer
            required:
              - id
      required:
        - resources

    BatchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        phone:
          type: string
        website:
          type: string
          format: uri
        company:
          type: string
        address:
          type: string
        billing_address:
          type: string
        vat_id:
          type: string
        currency:
          type: string
          maxLength: 3
        type:
          type: string
          enum: [company, individual]
        status:
          type: string
          enum: [lead, active, inactive]
        notes:
          type: string
        custom_values:
          type: object
          description: Custom field values keyed by custom field id. Unknown ids are dropped; fields left out keep their value.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

    Contact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        phone:
          type: string
        position:
          type: string
        role:
          type: string
          enum: [decision_maker, finance, technical, other]
        is_primary:
          type: boolean
        has_portal_access:
          type: boolean
        notes:
          type: string
        custom_values:
          type: object
          description: Custom field values keyed by custom field id. Unknown ids are dropped; fields left out keep their value.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - customer_id
        - first_name

    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          type: string
          enum: [planned, active, on_hold, completed, cancelled]
        visibility:
          type: string
          enum: [internal, client]
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        notes:
          type: string
        custom_values:
          type: object
          description: Custom field values keyed by custom field id. Unknown ids are dropped; fields left out keep their value.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

    Sale:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
        name:
          type: string
          maxLength: 255
        value:
          type: number
          format: decimal
        currency:
          type: string
          maxLength: 3
        probability:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
          enum: [lead, qualified, proposal_sent, won, lost]
        won_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Set when the deal moves to won, cleared if it is reopened
        expected_close_date:
          type: string
          format: date
        assigned_to:
          type: integer
          nullable: true
          description: Id of the user who owns the deal
        notes:
          type: string
        custom_values:
          type: object
          description: Custom field values keyed by custom field id. Unknown ids are dropped; fields left out keep their value.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name
        - customer_id

    Contract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
        project_id:
          type: integer
        sale_id:
          type: integer
        title:
          type: string
          maxLength: 255
        description:
          type: string
        value:
          type: number
          format: decimal
        currency:
          type: string
          maxLength: 3
        type:
          type: string
          enum: [fixed, recurring]
        status:
          type: string
          enum: [draft, active, expired, cancelled]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        signed_date:
          type: string
          format: date
        notes:
          type: string
        custom_values:
          type: object
          description: Custom field values keyed by custom field id. Unknown ids are dropped; fields left out keep their value.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - title

    Milestone:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project_id:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: string
        due_date:
          type: string
          format: date
        is_completed:
          type: boolean
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - project_id
        - name

    Tag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        color:
          type: string
          maxLength: 7
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - name

    CustomerNote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
        user_id:
          type: integer
          readOnly: true
          description: Always the user the token belongs to
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - customer_id
        - content

    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        is_active:
          type: boolean
        permissions:
          type: object
          nullable: true
          description: Per-module view, edit and delete flags for non-admin users
          additionalProperties: true
        theme:
          type: string
          enum: [auto, light, dark]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [low, normal, high]
        due_date:
          type: string
          format: date
          nullable: true
        project_id:
          type: integer
          nullable: true
        customer_id:
          type: integer
          nullable: true
        assigned_to:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
