              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '200':
          description: Articles created
    patch:
      tags:
        - Knowledge Base
      summary: Batch update articles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateRequest'
      responses:
        '200':
          description: Articles updated
    delete:
      tags:
        - Knowledge Base
      summary: Batch delete articles
      parameters:
        - name: resources
          in: query
          description: Comma-separated list of resource IDs to delete
          required: true
          schema:
            type: string
            example: "1,2,3"
      responses:
        '200':
          description: Articles deleted

  /articles/{id}:
