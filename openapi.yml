        number:
          type: string
          readOnly: true
        status:
          type: string
          enum: [draft, sent, cancelled]
          description: Stored status; paid, partially paid and overdue follow from total, amount_paid and due_date
          readOnly: true
        issue_date:
          type: string
          format: date
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
        currency:
          type: string
          readOnly: true
        total:
          type: number
          format: decimal
          readOnly: true
        amount_paid:
          type: number
          format: decimal
          description: Payments plus issued credit notes
          readOnly: true
        recurring_interval:
          type: string
