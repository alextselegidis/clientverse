<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | Clientverse</title>
    <meta name="theme-color" content="#33507a">
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f6f9;
            color: #495057;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        main {
            padding: 2rem;
            max-width: 24rem;
        }

        img {
            width: 64px;
            height: 64px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 1.5rem 0 0.5rem;
            color: #33507a;
        }

        p {
            margin: 0 0 1.5rem;
        }

        button {
            padding: 0.5rem 1.25rem;
            font: inherit;
            font-weight: 500;
            color: #fff;
            background-color: #33507a;
            border: 0;
            border-radius: 0.375rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <img src="images/logo.png" alt="Clientverse">
    <h1>You are offline</h1>
    <p>Clientverse needs a connection to your server. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
</main>
</body>
</html>
